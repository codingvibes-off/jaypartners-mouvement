<section class="entete-faq">
  <span class="badge">{{ 'faq.badge' | translate }}</span>
  <h1 [innerHTML]="'faq.titre' | translate"></h1>
  <p class="sous-titre">
    {{ 'faq.sousTitre' | translate }}
  </p>
</section>

<section class="liste-faq">
  @for (item of questions; track item.question; let i = $index) {
    <div class="item-faq" [class.ouvert]="ouvertIndex() === i">
      <button class="question-faq" (click)="basculer(i)" [attr.aria-expanded]="ouvertIndex() === i">
        <span>{{ item.question | translate }}</span>
        <span class="chevron-faq">
          <app-icon nom="chevron-down" [taille]="18"></app-icon>
        </span>
      </button>
      @if (ouvertIndex() === i) {
        <p class="reponse-faq">{{ item.reponse | translate }}</p>
      }
    </div>
  }
</section>

<section class="cta-faq">
  <p>{{ 'faq.autreQuestion' | translate }}</p>
  <a routerLink="/contact" class="btn-primaire">{{ 'faq.contacterJay' | translate }}</a>
</section>
