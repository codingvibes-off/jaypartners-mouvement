<header class="navbar">
  <div class="navbar-inner">
    <a routerLink="/" class="logo">
      <span class="logo-text">JAY <span class="accent">PARTNER'S</span></span>
    </a>

    <nav class="menu-pilule">
      <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }" class="menu-link">
        Accueil
      </a>
      <a routerLink="/decouvrir" routerLinkActive="actif" class="menu-link">Découvrir</a>
      <a routerLink="/programmes" routerLinkActive="actif" class="menu-link">Programmes</a>
      @if (auth.estConnecte()) {
        <a routerLink="/calendrier" routerLinkActive="actif" class="menu-link">Calendrier</a>
      }
    </nav>

    <div class="actions">
      @if (auth.estConnecte()) {
        <div class="user-info">
          <span class="avatar">👤</span>
          <span class="prenom">{{ auth.utilisateurCourant()?.prenom }}</span>
        </div>
        <button class="btn-secondaire" (click)="deconnexion()">Déconnexion</button>
      } @else {
        <a routerLink="/connexion" class="lien-connexion">Connexion</a>
        <a routerLink="/inscription" class="btn-primaire btn-inscription">S'inscrire</a>
      }

      <button
        class="burger"
        [class.ouvert]="menuOuvert()"
        (click)="basculerMenu()"
        [attr.aria-expanded]="menuOuvert()"
        aria-label="Menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <nav class="menu-mobile">
    <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }" class="menu-mobile-link" (click)="fermerMenu()">
      Accueil
    </a>
    <a routerLink="/decouvrir" routerLinkActive="actif" class="menu-mobile-link" (click)="fermerMenu()">Découvrir</a>
    <a routerLink="/programmes" routerLinkActive="actif" class="menu-mobile-link" (click)="fermerMenu()">Programmes</a>
    @if (auth.estConnecte()) {
      <a routerLink="/calendrier" routerLinkActive="actif" class="menu-mobile-link" (click)="fermerMenu()">
        Calendrier
      </a>
    }
  </nav>
</header>
