<svg
  [attr.width]="taille"
  [attr.height]="taille"
  viewBox="0 0 24 24"
  fill="none"
  class="icone"
  aria-hidden="true"
>
  @switch (nom) {
    @case ('play') {
      <path d="M8 5v14l11-7L8 5Z" fill="currentColor" />
    }
    @case ('pause') {
      <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" />
      <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
      <path d="M12 11v5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <circle cx="12" cy="8" r="1.1" fill="currentColor" />
    }
    @case ('download') {
      <path
        d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }
    @case ('calendar') {
      <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8" />
      <path d="M3 9.5h18" stroke="currentColor" stroke-width="1.8" />
      <path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="12" cy="14.5" r="1.4" fill="currentColor" />
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    }
    @case ('arrow-right') {
      <path
        d="M5 12h14M13 6l6 6-6 6"
        stroke="currentColor"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }
    @case ('arrow-left') {
      <path
        d="M19 12H5M11 6l-6 6 6 6"
        stroke="currentColor"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }
    @case ('chevron-left') {
      <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('chevron-right') {
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('chevron-down') {
      <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
      <path d="M12 7v5.5l4 2.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    }
    @case ('check') {
      <path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    }
  }
</svg>
