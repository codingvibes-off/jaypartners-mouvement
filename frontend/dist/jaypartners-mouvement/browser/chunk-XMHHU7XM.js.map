<section class="conteneur-auth">
  <div class="carte-auth">
    <h1>{{ titre }}</h1>

    <div class="boutons-oauth">
      <button type="button" class="btn-oauth btn-oauth-google" (click)="connexionOAuth('google')">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path
            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"
            fill="#4285F4"
          />
          <path
            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18Z"
            fill="#34A853"
          />
          <path
            d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33Z"
            fill="#FBBC05"
          />
          <path
            d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58Z"
            fill="#EA4335"
          />
        </svg>
        Continuer avec Google
      </button>
      <button type="button" class="btn-oauth btn-oauth-apple" (click)="connexionOAuth('apple')">
        <svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor" aria-hidden="true">
          <path
            d="M13.1 9.53c-.02-2.02 1.65-2.99 1.72-3.04-.94-1.37-2.4-1.56-2.92-1.58-1.24-.13-2.43.73-3.06.73-.63 0-1.6-.71-2.63-.7-1.35.02-2.6.79-3.3 1.99-1.4 2.44-.36 6.05 1.02 8.03.67.96 1.47 2.05 2.51 2.01 1.01-.04 1.39-.65 2.61-.65 1.21 0 1.56.65 2.62.63 1.08-.02 1.77-.98 2.43-1.95a8.6 8.6 0 0 0 1.09-2.26 3.72 3.72 0 0 1-2.09-3.21Z"
          />
          <path
            d="M11.06 3.5c.55-.67.92-1.6.82-2.5-.79.03-1.75.53-2.32 1.18-.51.58-.96 1.53-.84 2.44.88.06 1.79-.44 2.34-1.12Z"
          />
        </svg>
        Continuer avec Apple
      </button>
    </div>

    @if (oauthMessage()) {
      <p class="oauth-message">{{ oauthMessage() }}</p>
    }

    <div class="separateur"><span>ou</span></div>

    <form (ngSubmit)="soumettre()">
      @if (estInscription) {
        <label>
          Prénom
          <input type="text" name="prenom" [(ngModel)]="prenom" required />
        </label>
      }

      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required />
      </label>

      <label>
        Mot de passe
        <input type="password" name="password" [(ngModel)]="password" required minlength="6" />
      </label>

      @if (erreur()) {
        <p class="erreur">{{ erreur() }}</p>
      }

      <button type="submit" class="btn-primaire" [disabled]="enCours()">
        {{ enCours() ? 'Patiente...' : titre }}
      </button>
    </form>

    <p class="lien-alt">
      @if (estInscription) {
        Déjà un compte ? <a routerLink="/connexion">Se connecter</a>
      } @else {
        Pas encore de compte ? <a routerLink="/inscription">S'inscrire</a>
      }
    </p>
  </div>
</section>
